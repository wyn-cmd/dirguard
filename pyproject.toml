[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dirguard"
version = "0.1.0"
description = "A lightweight tool to generate and verify directory integrity via SHA256."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dirguard = "dirguard.cli:main"
